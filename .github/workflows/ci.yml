name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scenario suite lives in a separate private checkout; every other
      # release criterion runs here. See docs/qa.md for the full gate.
      - run: SKIP_SCENARIO=1 pnpm gate
